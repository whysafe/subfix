[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subfix"
version = "1.0.0"
description = "Починка субтитров: сдвиг, синхронизация по двум точкам, FPS, кодировка, SRT и VTT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "whysafe" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
subfix = "subfix.cli:main"

[tool.setuptools]
packages = ["subfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
